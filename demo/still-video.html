<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QuickLiquid — 200+ stars</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #f1f2f5; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; }
      #art { position: relative; width: 1200px; height: 1200px; overflow: hidden; background: radial-gradient(circle at 18% 12%, #fffef9 0 18%, transparent 54%), linear-gradient(132deg, #fbfbfa 0%, #e9ebf1 58%, #f9f8f5 100%); }
      .brand { position: absolute; z-index: 30; top: 72px; width: 100%; margin: 0; text-align: center; color: #111318; font-size: 44px; font-weight: 680; letter-spacing: -2px; }
      .optical-set { position: absolute; inset: 0; }
      .spectral-field { position: absolute; left: -180px; top: 270px; width: 1560px; height: 530px; transform-origin: center; background: linear-gradient(180deg, transparent 2%, rgba(31, 89, 113, .08) 20%, rgba(55, 219, 230, .48) 34%, rgba(93, 126, 245, .43) 45%, rgba(211, 105, 231, .43) 57%, rgba(255, 173, 81, .45) 70%, rgba(255, 235, 163, .25) 81%, transparent 98%); filter: blur(12px); }
      .dark-line, .white-line { position: absolute; left: -240px; width: 1700px; transform-origin: center; }
      .dark-line { top: 505px; height: 8px; background: linear-gradient(90deg, transparent, #153849 12%, #8f47a2 49%, #153849 88%, transparent); box-shadow: 0 36px 0 rgba(25, 67, 84, .42); }
      .white-line { top: 552px; height: 7px; background: linear-gradient(90deg, transparent, #fff 14%, #fff 88%, transparent); box-shadow: 0 26px 0 rgba(255,255,255,.78), 0 -22px 0 rgba(255,255,255,.65); }
      .microcopy { position: absolute; top: 410px; left: -120px; width: 1480px; display: flex; justify-content: space-around; color: rgba(19, 42, 55, .58); font: 700 18px/1 Consolas, monospace; letter-spacing: 7px; white-space: nowrap; }
      .halo { position: absolute; left: 85px; top: 690px; width: 1000px; height: 100px; border-radius: 50%; background: linear-gradient(90deg, rgba(255,211,91,.35), rgba(69,234,221,.38), rgba(102,126,255,.34), rgba(233,99,196,.3), rgba(255,190,80,.3)); filter: blur(31px); }
      .digits { position: absolute; z-index: 10; inset: 0; }
      .segment { position: absolute; }
      .segment > .ql-content { position: absolute !important; inset: 0; }
      .segment-core { position: absolute; inset: 10px; border-radius: inherit; border: 1px solid rgba(255,255,255,.83); box-shadow: inset 2px 2px 5px rgba(255,255,255,.72), inset -3px -4px 8px rgba(67,88,108,.1); }
      .headline { position: absolute; z-index: 30; top: 852px; width: 100%; margin: 0; text-align: center; color: #111318; font-size: 54px; font-weight: 680; letter-spacing: -2.5px; }
      .thanks { position: absolute; z-index: 30; top: 934px; width: 100%; margin: 0; text-align: center; color: #41444c; font-size: 27px; font-weight: 380; }
      .url { position: absolute; z-index: 30; top: 1083px; width: 100%; margin: 0; text-align: center; color: #666a73; font: 18px/1.2 Consolas, monospace; }
      .grain { position: absolute; z-index: 40; inset: 0; pointer-events: none; opacity: .035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); mix-blend-mode: multiply; }
    </style>
  </head>
  <body>
    <main id="art">
      <h1 class="brand">QuickLiquid</h1>
      <div class="optical-set">
        <div class="spectral-field"></div>
        <div class="dark-line"></div>
        <div class="white-line"></div>
        <div class="microcopy"><span>REFRACTION</span><span>DISPERSION</span><span>SPRING MOTION</span></div>
        <div class="halo"></div>
      </div>
      <div class="digits"></div>
      <h2 class="headline">200+ GitHub stars.</h2>
      <p class="thanks">Thank you for being part of it.</p>
      <p class="url">github.com/amarnath3003/quickLiquid</p>
      <div class="grain"></div>
    </main>
    <script type="module" src="/src/still-video.ts"></script>
  </body>
</html>
